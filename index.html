<script>
  document.addEventListener("DOMContentLoaded", function () {
    const slider = document.getElementById('hsnlogix-portfolio-slider');
    const track = slider.querySelector('.hsnlogix-slider-track');
    const items = Array.from(track.children);

    let loopWidth = 0;
    items.forEach(item => {
      const style = getComputedStyle(item);
      loopWidth += item.offsetWidth + parseFloat(style.marginLeft) + parseFloat(style.marginRight);
    });

    items.forEach(item => track.appendChild(item.cloneNode(true)));

    let pos = 0;
    let currentRate = 1, targetRate = 1;
    const baseSpeed = window.innerWidth <= 768
      ? loopWidth / 40
      : loopWidth / 50;
    let lastTime = performance.now();

    function animate(time) {
      const dt = (time - lastTime) / 1000;
      lastTime = time;
      currentRate += (targetRate - currentRate) * 0.25;
      pos = (pos + baseSpeed * currentRate * dt) % loopWidth;
      track.style.transform = `translateX(${-pos}px)`;
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    slider.addEventListener('mouseenter', () => targetRate = 0.35);
    slider.addEventListener('mouseleave', () => targetRate = 1);
  });
</script>
