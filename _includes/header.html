<header class="site-header">
  <div class="container site-header__inner">
    <!-- Logo — far left -->
    <div class="logo">
      <a href="{{ '/' | relative_url }}">
        <span class="logo-hsn">HSN</span>
        <span class="logo-logix">Logix</span>
      </a>
    </div>

    <!-- Right-side group: inline links + CTA + hamburger -->
    <div class="header-right">
      <!-- Inline nav links (hidden below 480px, those widths use the drawer) -->
      <nav class="header-inline-nav" aria-label="Primary navigation">
        <a href="{{ '/case-studies/' | relative_url }}" class="header-inline-link">Case Studies</a>
        <a href="{{ '/' | relative_url }}#testimonials" class="header-inline-link">Testimonials</a>
      </nav>

      <!-- Book a Call -->
      <a href="https://cal.com/hsnlogix" data-cal-link="hsnlogix" data-cal-config='{"layout":"month_view"}' rel="noopener" class="cta-button header-cta">
        <div class="button-text">
          <p>Book a Call</p>
        </div>
        <div class="button-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <path d="M200,64V168a8,8,0,0,1-16,0V83.31L69.66,197.66a8,8,0,0,1-11.32-11.32L172.69,72H88a8,8,0,0,1,0-16H192A8,8,0,0,1,200,64Z"></path>
          </svg>
        </div>
      </a>

      <!-- Hamburger — far right, with gap from CTA -->
      <button class="menu-toggle" aria-label="Toggle menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </div>
</header>
