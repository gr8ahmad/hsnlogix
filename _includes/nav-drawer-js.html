<script>
// Off-canvas nav drawer (slides in from the right)
(function () {
  var menuToggle = document.querySelector('.menu-toggle');
  var navDrawer = document.getElementById('navDrawer');
  var navOverlay = document.getElementById('navOverlay');
  var navDrawerClose = document.getElementById('navDrawerClose');
  if (!navDrawer) return;

  // Closed drawer must not be reachable by keyboard or screen reader
  navDrawer.setAttribute('inert', '');

  function openDrawer() {
    navDrawer.removeAttribute('inert');
    navDrawer.classList.add('active');
    navOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    if (menuToggle) { menuToggle.setAttribute('aria-expanded', 'true'); menuToggle.setAttribute('aria-label', 'Close menu'); }
    var first = navDrawer.querySelector('.nav-drawer__link:not([style*="display: none"])');
    var target = (navDrawerClose || first);
    if (target) target.focus();
  }
  function closeDrawer(returnFocus) {
    navDrawer.classList.remove('active');
    navOverlay.classList.remove('active');
    navDrawer.setAttribute('inert', '');
    document.body.style.overflow = '';
    if (menuToggle) { menuToggle.setAttribute('aria-expanded', 'false'); menuToggle.setAttribute('aria-label', 'Open menu'); if (returnFocus) menuToggle.focus(); }
  }

  if (menuToggle) menuToggle.addEventListener('click', openDrawer);
  if (navDrawerClose) navDrawerClose.addEventListener('click', function () { closeDrawer(true); });
  if (navOverlay) navOverlay.addEventListener('click', function () { closeDrawer(true); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && navDrawer.classList.contains('active')) closeDrawer(true);
  });

  document.querySelectorAll('.nav-drawer__link').forEach(function (link) {
    link.addEventListener('click', function () { closeDrawer(false); });
  });
})();
</script>
