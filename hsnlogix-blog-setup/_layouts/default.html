<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}HSNLOGIX Blog</title>
  <meta name="description" content="{{ page.excerpt | strip_html | truncate: 150 }}">
  <link rel="icon" href="/favicon.ico">
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 760px; margin: 0 auto; padding: 40px 20px; line-height: 1.6; color: #1a1a1a; }
    a { color: #1F3864; }
    header { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
    header img { height: 32px; }
    header nav a { margin-left: 20px; text-decoration: none; font-weight: 600; }
    .post-list-item { margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px solid #eee; }
    .post-list-item h2 { margin-bottom: 4px; }
    .post-list-item time { color: #777; font-size: 14px; }
    article time { color: #777; display: block; margin-bottom: 24px; }
    footer { margin-top: 60px; color: #777; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <a href="/"><img src="/HSNLogix-logo.jpg" alt="HSNLOGIX"></a>
    <nav>
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    &copy; {{ 'now' | date: "%Y" }} HSNLOGIX. <a href="/">hsnlogix.com</a>
  </footer>
</body>
</html>
