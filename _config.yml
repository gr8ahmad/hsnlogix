title: HSNLOGIX Blog
description: Shopify and web development insights from HSNLOGIX
url: "https://hsnlogix.com"

# Clean URLs: no date, no .html extension.
# Example: hsnlogix.com/blog/post-title/
permalink: /blog/:title/

collections:
  posts:
    output: true
  case_studies:
    output: true
    permalink: /case-studies/:path/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
