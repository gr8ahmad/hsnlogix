---
layout: default
---
<article class="blog-post service-page">
  <p class="blog-back"><a href="{{ '/#services' | relative_url }}">&larr; Back to services</a></p>

  <h1 class="blog-post-title">{{ page.title }}</h1>

  {% if page.intro %}
  <p class="service-intro">{{ page.intro }}</p>
  {% endif %}

  {% if page.includes %}
  <div class="service-section">
    <h2 class="service-section-title">What's Included</h2>
    <ul class="service-list">
      {% for item in page.includes %}
      <li>{{ item }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}

  <div class="service-section">
    <h2 class="service-section-title">Why It Matters</h2>
    <div class="blog-post-body">
      {{ content }}
    </div>
  </div>

  <div class="service-cta">
    <a href="{{ '/#contact' | relative_url }}" class="cta-button">
      <div class="button-text">
        <p>Book a free consultation</p>
      </div>
      <div class="button-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
          <path d="M200,64V168a8,8,0,0,1-16,0V83.31L69.66,197.66a8,8,0,0,1-11.32-11.32L172.69,72H88a8,8,0,0,1,0-16H192A8,8,0,0,1,200,64Z"></path>
        </svg>
      </div>
    </a>
  </div>
</article>
