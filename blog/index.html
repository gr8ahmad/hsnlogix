---
layout: default
title: Blog
permalink: /blog/
---
<div class="blog-index">
  <h1 class="blog-index-title">Blog</h1>
  <p class="blog-index-subtitle">Shopify, Webflow, and ecommerce development notes from HSNLOGIX.</p>

  <div class="blog-post-list">
    {% for post in site.posts %}
    <a class="blog-post-card" href="{{ post.url }}">
      <h2>{{ post.title }}</h2>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time>
      <p>{{ post.excerpt | strip_html | truncate: 160 }}</p>
      <span class="blog-read-more">Read more &rarr;</span>
    </a>
    {% endfor %}
  </div>
</div>
